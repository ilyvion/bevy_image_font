name: "Draft new release"

on:
    workflow_dispatch:
        inputs:
            version:
                description: "The version you want to release, without a 'v' prefix."
                required: true

jobs:
    draft-new-release:
        name: "Draft a new release for ${{ github.event.inputs.version }}"
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        env:
            VERSION: ${{ github.event.inputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Create release branch
              run: git checkout -b "release/$VERSION"

            - name: Update changelog
              run: .github/scripts/prepare_changelog.sh "$VERSION"

            - name: Install cargo-bump
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-bump

            - name: Bump version in Cargo.toml
              run: cargo bump "$VERSION"

            - name: Check we haven't violated semver
              uses: obi1kenobi/cargo-semver-checks-action@v2
              with:
                  verbose: true

            - name: Commit changelog and manifest files
              id: make-commit
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email noreply@github.com
                  git add CHANGELOG.md Cargo.toml
                  git commit --message "chore: prepare release $VERSION"

                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Push new branch
              run: git push origin "release/$VERSION"

            - name: Create pull request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  COMMIT: ${{ steps.make-commit.outputs.commit }}
                  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  gh pr create \
                      --base main \
                      --head "release/$VERSION" \
                      --title "Release version $VERSION" \
                      --reviewer "$GITHUB_ACTOR" \
                      --body "Hi @$GITHUB_ACTOR!

                  This PR was created in response to a manual trigger of the release workflow here: $RUN_URL.
                  I've updated the changelog and bumped the version in the manifest in this commit: $COMMIT.

                  Merging this PR will publish the crate to crates.io and create a GitHub release."
